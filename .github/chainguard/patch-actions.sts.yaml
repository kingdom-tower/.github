# Octo STS trust policy for the ActionChain2 patch-actions deployment's
# distribute, used for the test-org distribute run (actionchain2 switch A,
# ACID-1205). See: https://github.com/octo-sts/app
#
# Grants patch-actions-sa@prod-actions-diei.iam.gserviceaccount.com a GitHub
# App token over every repo in this org: distribute creates one output repo
# per action, pushes its version branch and tags, and sets its visibility.
# Mirrors chainguard-actions' prod-actions.sts.yaml without issues (only prod's
# issuegroom needs it).
#
# OCTO_IDENTITY should be set to: patch-actions
#
# $schema: https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

issuer: https://accounts.google.com
subject: "108056040279057031319"

permissions:
  contents: write
  metadata: read
  administration: write
  workflows: write

repositories: [] # Act over all of the repos in the org.
